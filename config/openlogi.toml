# OpenLogi - Logitech HID++ device control for the MX Master 3S.
#
# Seeded from dotfiles on the first activation and owned by the app from its
# first save onwards, so the device block and the button bindings the GUI writes
# are expected to diverge from this copy. The schema is strict: an unknown,
# obsolete or out-of-range value stops the file loading, and `schema_version`
# must be one the installed build knows (0 or newer than it is refused).
schema_version = 7

[app_settings]
# NixOS starts openlogi-agent with the niri session (machines/strix), so the app
# must not also register it on graphical-session.target - GNOME reaches that
# target too, and the agent would then come up in a session it does not belong
# to. Turning the GUI's launch-at-login toggle back on trades that away.
launch_at_login = false

# 0.5x - the multiplier is value/14. It carries the 0.5 that homes/niri's mouse
# block used to apply, which is gone now that the app owns the wheel; leaving it
# at 14 here would double the distance per notch on the machines that seed this.
vertical_scroll_sensitivity = 7

# Keyed by the mouse's own serial, so the settings follow the hardware rather
# than a receiver route. The app re-keys this to `unit:<unit-id>` once it reads
# a HID++ unit id and folds the entry over on the next online sighting, which is
# why the serial form is safe to write here.
[devices."serial:2501apx0zqq8"]
# 1000 is what the sensor is set to today; the button under the wheel cycles up
# from there. `dpi` lives in device RAM, so persisting it is what carries it
# across a power cycle.
dpi_presets = [1000, 1600, 2400]
dpi = 1000
# 0x2121 hi-res wheel: finer reports between ratchet steps.
scroll_resolution = "high"

[devices."serial:2501apx0zqq8".bindings]
DpiToggle = "CycleDpiPresets"

[devices."serial:2501apx0zqq8".bindings.GestureButton]
# The seeded directions are the Logi Options+ defaults and three of them are dead
# on Linux - MissionControl, AppExpose and ShowDesktop only debug-log "no Linux
# equivalent" (openlogi-inject/src/inject/linux.rs). These drive niri's own binds
# instead: Super+Up/Down are focus-workspace-up/down, and Click sends KEY_SYSRQ,
# which this config binds as `Print { screenshot; }`.
Up = { CustomShortcut = "Super+Up" }
Down = { CustomShortcut = "Super+Down" }
Left = "PrevTab"
Right = "NextTab"
Click = "Screenshot"

[devices."serial:2501apx0zqq8".smartshift]
# The wheel's current state, written down because these live in device RAM and do
# not survive a power cycle. 255 would hold the ratchet permanently and 8 is the
# floor before free-spin sticks; tunable_torque 0 means "device exposes none",
# the same value the app writes for an absent level.
mode = "free"
auto_disengage = 10
tunable_torque = 0
